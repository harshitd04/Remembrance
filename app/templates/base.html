<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Remembrance - Voice Journaling{% endblock %}</title>
    
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Ambient orb -->
    <div class="ambient-orb-secondary"></div>
    
    <div class="container">
        <nav>
            <a href="/">Home</a>
            <a href="/journals">Journals</a>
            <a href="/search">Search</a>
            <a href="/summary">Summaries</a>
            <a href="/settings">Settings</a>
            <a href="/settings" style="margin-left: auto; color: rgba(255, 255, 255, 0.6); font-size: 0.9rem; text-decoration: none;">
                👤 {{ current_user|title }}
            </a>
        </nav>
        
        {% block content %}{% endblock %}
    </div>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
