{% extends "base.html" %}

{% block title %}Journals - Remembrance{% endblock %}

{% block extra_css %}
<style>
    .journals-container {
        max-width: 900px;
        margin: 0 auto;
    }

    .date-picker-card {
        background: rgba(26, 26, 26, 0.6);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(168, 85, 247, 0.3);
        border-radius: 12px;
        padding: 2rem;
        margin-bottom: 2rem;
    }

    .date-input-group {
        display: flex;
        gap: 1rem;
        align-items: flex-end;
        margin-top: 1rem;
    }

    .date-input-group input[type="date"] {
        flex: 1;
        padding: 0.75rem;
        font-size: 1rem;
    }

    .entries-container {
        margin-top: 2rem;
    }

    .entry-card {
        background: rgba(26, 26, 26, 0.6);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(168, 85, 247, 0.3);
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1rem;
        transition: all 0.3s ease;
    }

    .entry-card:hover {
        border-color: rgba(168, 85, 247, 0.5);
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
    }

    .entry-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .entry-header-left {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
    }

    .entry-date {
        color: var(--color-violet);
        font-weight: 500;
        font-size: 1.1rem;
    }

    .entry-time {
        color: var(--color-text-muted);
        font-size: 0.9rem;
    }

    .delete-btn {
        padding: 0.5rem 1rem;
        background: rgba(239, 68, 68, 0.2);
        border: 1px solid rgba(239, 68, 68, 0.4);
        border-radius: 6px;
        color: #ef4444;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .delete-btn:hover {
        background: rgba(239, 68, 68, 0.3);
        border-color: rgba(239, 68, 68, 0.6);
        transform: translateY(-1px);
    }

    .delete-btn:active {
        transform: translateY(0);
    }

    .entry-content {
        color: var(--color-text);
        line-height: 1.8;
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    .entry-meta {
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        color: var(--color-text-muted);
    }

    .entry-type {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        background: rgba(168, 85, 247, 0.2);
        border-radius: 20px;
        font-size: 0.8rem;
    }

    .no-entries {
        text-align: center;
        padding: 3rem;
        color: var(--color-text-muted);
    }

    .no-entries-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
        opacity: 0.5;
    }

    .quick-dates {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
        flex-wrap: wrap;
    }

    .quick-date-btn {
        padding: 0.5rem 1rem;
        background: rgba(168, 85, 247, 0.1);
        border: 1px solid rgba(168, 85, 247, 0.3);
        border-radius: 6px;
        color: var(--color-text);
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.9rem;
    }

    .quick-date-btn:hover {
        background: rgba(168, 85, 247, 0.2);
        border-color: rgba(168, 85, 247, 0.5);
    }

    .view-mode-tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        border-bottom: 2px solid rgba(168, 85, 247, 0.2);
    }

    .view-tab {
        flex: 1;
        padding: 0.75rem 1rem;
        background: transparent;
        border: none;
        border-bottom: 3px solid transparent;
        color: var(--color-text-muted);
        cursor: pointer;
        transition: all 0.2s;
        font-size: 1rem;
        font-weight: 500;
    }

    .view-tab:hover {
        color: var(--color-text);
        background: rgba(168, 85, 247, 0.05);
    }

    .view-tab.active {
        color: var(--color-violet);
        border-bottom-color: var(--color-violet);
        background: rgba(168, 85, 247, 0.1);
    }

    .view-content {
        display: none;
    }

    .view-content.active {
        display: block;
    }
</style>
{% endblock %}

{% block content %}
<div class="journals-container">
    <h1>📖 My Journals</h1>
    
    <div class="date-picker-card">
        <h2>Select Time Period</h2>
        <p style="color: var(--color-text-muted); margin-bottom: 1rem;">
            Choose how you want to view your journal entries
        </p>
        
        <!-- View Mode Tabs -->
        <div class="view-mode-tabs">
            <button class="view-tab active" onclick="switchViewMode('day')" id="tab-day">
                📅 Day
            </button>
            <button class="view-tab" onclick="switchViewMode('week')" id="tab-week">
                📆 Week
            </button>
            <button class="view-tab" onclick="switchViewMode('month')" id="tab-month">
                🗓️ Month
            </button>
        </div>
        
        <!-- Day View -->
        <div id="view-day" class="view-content active">
            <div class="quick-dates">
                <button class="quick-date-btn" onclick="loadToday()">Today</button>
                <button class="quick-date-btn" onclick="loadYesterday()">Yesterday</button>
                <button class="quick-date-btn" onclick="loadLastWeek()">Last Week</button>
            </div>
            
            <div class="date-input-group">
                <div class="form-group" style="flex: 1; margin: 0;">
                    <label for="entry-date">Date</label>
                    <input type="date" id="entry-date" required>
                </div>
                <button onclick="loadDayEntries()" class="btn btn-primary">
                    View Day
                </button>
            </div>
        </div>
        
        <!-- Week View -->
        <div id="view-week" class="view-content">
            <div class="date-input-group">
                <div class="form-group" style="flex: 1; margin: 0;">
                    <label for="week-select">Select Week</label>
                    <select id="week-select" class="form-control">
                        <option value="">Choose a week...</option>
                    </select>
                </div>
                <button onclick="loadWeekEntries()" class="btn btn-primary">
                    View Week
                </button>
            </div>
        </div>
        
        <!-- Month View -->
        <div id="view-month" class="view-content">
            <div class="date-input-group">
                <div class="form-group" style="flex: 1; margin: 0;">
                    <label for="month-select">Select Month</label>
                    <select id="month-select" class="form-control">
                        <option value="">Choose a month...</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 0 0 150px; margin: 0;">
                    <label for="year-select">Year</label>
                    <select id="year-select" class="form-control">
                        <option value="">Year...</option>
                    </select>
                </div>
                <button onclick="loadMonthEntries()" class="btn btn-primary">
                    View Month
                </button>
            </div>
        </div>
    </div>
    
    <div id="entries-container" class="entries-container"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Set today's date as default and populate dropdowns
document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('entry-date').value = today;
    
    populateWeekDropdown();
    populateMonthDropdown();
    populateYearDropdown();
    
    loadDayEntries();
});

function switchViewMode(mode) {
    // Update tabs
    document.querySelectorAll('.view-tab').forEach(tab => tab.classList.remove('active'));
    document.getElementById(`tab-${mode}`).classList.add('active');
    
    // Update content
    document.querySelectorAll('.view-content').forEach(content => content.classList.remove('active'));
    document.getElementById(`view-${mode}`).classList.add('active');
}

function populateWeekDropdown() {
    const weekSelect = document.getElementById('week-select');
    const currentYear = new Date().getFullYear();
    
    for (let week = 1; week <= 52; week++) {
        const dates = getWeekDates(week, currentYear);
        const option = document.createElement('option');
        option.value = week;
        option.textContent = `Week ${week} (${dates.start} - ${dates.end})`;
        weekSelect.appendChild(option);
    }
}

function populateMonthDropdown() {
    const monthSelect = document.getElementById('month-select');
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                    'July', 'August', 'September', 'October', 'November', 'December'];
    
    months.forEach((month, index) => {
        const option = document.createElement('option');
        option.value = index + 1;
        option.textContent = month;
        monthSelect.appendChild(option);
    });
    
    // Set current month
    monthSelect.value = new Date().getMonth() + 1;
}

function populateYearDropdown() {
    const yearSelect = document.getElementById('year-select');
    const currentYear = new Date().getFullYear();
    
    for (let year = currentYear; year >= currentYear - 5; year--) {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        yearSelect.appendChild(option);
    }
    
    yearSelect.value = currentYear;
}

function getWeekDates(weekNum, year) {
    const jan1 = new Date(year, 0, 1);
    const daysOffset = (weekNum - 1) * 7;
    const weekStart = new Date(jan1);
    weekStart.setDate(jan1.getDate() + daysOffset - jan1.getDay() + 1);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    
    const formatDate = (date) => {
        const month = date.toLocaleString('en-US', { month: 'short' });
        const day = date.getDate();
        return `${month} ${day}`;
    };
    
    return {
        start: formatDate(weekStart),
        end: formatDate(weekEnd),
        startDate: weekStart.toISOString().split('T')[0],
        endDate: weekEnd.toISOString().split('T')[0]
    };
}

function loadToday() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('entry-date').value = today;
    loadDayEntries();
}

function loadYesterday() {
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    document.getElementById('entry-date').value = yesterday.toISOString().split('T')[0];
    loadDayEntries();
}

function loadLastWeek() {
    const lastWeek = new Date();
    lastWeek.setDate(lastWeek.getDate() - 7);
    document.getElementById('entry-date').value = lastWeek.toISOString().split('T')[0];
    loadDayEntries();
}

function loadDayEntries() {
    const date = document.getElementById('entry-date').value;
    
    if (!date) {
        showNotification('Please select a date', 'error');
        return;
    }
    
    const container = document.getElementById('entries-container');
    container.innerHTML = '<p style="text-align: center; color: var(--color-text-muted);">Loading...</p>';
    
    fetch(`/journal/entries/${date}`)
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                displayEntries(data.entries, date, 'day');
            } else {
                showNotification('Failed to load entries', 'error');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showNotification('Failed to load entries', 'error');
            container.innerHTML = '';
        });
}

function loadWeekEntries() {
    const weekNum = document.getElementById('week-select').value;
    const year = new Date().getFullYear();
    
    if (!weekNum) {
        showNotification('Please select a week', 'error');
        return;
    }
    
    const container = document.getElementById('entries-container');
    container.innerHTML = '<p style="text-align: center; color: var(--color-text-muted);">Loading...</p>';
    
    const dates = getWeekDates(weekNum, year);
    loadDateRangeEntries(dates.startDate, dates.endDate, `Week ${weekNum}`);
}

function loadMonthEntries() {
    const month = document.getElementById('month-select').value;
    const year = document.getElementById('year-select').value;
    
    if (!month || !year) {
        showNotification('Please select month and year', 'error');
        return;
    }
    
    const container = document.getElementById('entries-container');
    container.innerHTML = '<p style="text-align: center; color: var(--color-text-muted);">Loading...</p>';
    
    const startDate = new Date(year, month - 1, 1);
    const endDate = new Date(year, month, 0);
    
    const monthName = startDate.toLocaleString('en-US', { month: 'long' });
    loadDateRangeEntries(
        startDate.toISOString().split('T')[0],
        endDate.toISOString().split('T')[0],
        `${monthName} ${year}`
    );
}

function loadDateRangeEntries(startDate, endDate, periodName) {
    const container = document.getElementById('entries-container');
    let allEntries = [];
    
    // Generate all dates in range (using local date strings to avoid timezone issues)
    const dates = [];
    const current = new Date(startDate + 'T00:00:00');
    const end = new Date(endDate + 'T00:00:00');
    
    while (current <= end) {
        const year = current.getFullYear();
        const month = String(current.getMonth() + 1).padStart(2, '0');
        const day = String(current.getDate()).padStart(2, '0');
        dates.push(`${year}-${month}-${day}`);
        current.setDate(current.getDate() + 1);
    }
    
    // Fetch entries for all dates
    Promise.all(dates.map(date => 
        fetch(`/journal/entries/${date}`)
            .then(res => res.json())
            .then(data => ({ date, entries: data.entries || [] }))
    ))
    .then(results => {
        results.forEach(result => {
            if (result.entries.length > 0) {
                result.entries.forEach(entry => {
                    allEntries.push({ ...entry, date: result.date });
                });
            }
        });
        
        displayRangeEntries(allEntries, periodName, startDate, endDate);
    })
    .catch(error => {
        console.error('Error:', error);
        showNotification('Failed to load entries', 'error');
        container.innerHTML = '';
    });
}

function displayRangeEntries(entries, periodName, startDate, endDate) {
    const container = document.getElementById('entries-container');
    
    if (!entries || entries.length === 0) {
        container.innerHTML = `
            <div class="no-entries">
                <div class="no-entries-icon">📝</div>
                <h3>No entries for ${periodName}</h3>
                <p>You haven't written any journal entries during this period</p>
            </div>
        `;
        return;
    }
    
    // Sort by date and time
    entries.sort((a, b) => {
        const dateCompare = new Date(b.date) - new Date(a.date);
        if (dateCompare !== 0) return dateCompare;
        return new Date(b.created_at) - new Date(a.created_at);
    });
    
    const entriesHTML = entries.map(entry => {
        const createdDate = new Date(entry.created_at);
        const timeStr = createdDate.toLocaleTimeString('en-US', { 
            hour: '2-digit', 
            minute: '2-digit' 
        });
        
        return `
            <div class="entry-card" data-entry-id="${entry.id}">
                <div class="entry-header">
                    <div class="entry-header-left">
                        <span class="entry-date">${formatDate(entry.date)}</span>
                        <span class="entry-time">${timeStr}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteEntry('${entry.date}', '${entry.id}')">
                        🗑️ Delete
                    </button>
                </div>
                <div class="entry-content">${escapeHtml(entry.content)}</div>
                ${entry.edited_at ? `<div class="entry-meta">
                    <span>Edited: ${new Date(entry.edited_at).toLocaleString()}</span>
                </div>` : ''}
            </div>
        `;
    }).join('');
    
    container.innerHTML = `
        <h2 style="margin-bottom: 1rem;">
            ${entries.length} ${entries.length === 1 ? 'Entry' : 'Entries'} in ${periodName}
        </h2>
        ${entriesHTML}
    `;
}

function displayEntries(entries, date, mode = 'day') {
    const container = document.getElementById('entries-container');
    
    if (!entries || entries.length === 0) {
        container.innerHTML = `
            <div class="no-entries">
                <div class="no-entries-icon">📝</div>
                <h3>No entries for this date</h3>
                <p>You haven't written any journal entries on ${formatDate(date)}</p>
            </div>
        `;
        return;
    }
    
    const entriesHTML = entries.map(entry => {
        const createdDate = new Date(entry.created_at);
        const timeStr = createdDate.toLocaleTimeString('en-US', { 
            hour: '2-digit', 
            minute: '2-digit' 
        });
        
        return `
            <div class="entry-card" data-entry-id="${entry.id}">
                <div class="entry-header">
                    <div class="entry-header-left">
                        <span class="entry-date">${formatDate(date)}</span>
                        <span class="entry-time">${timeStr}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteEntry('${date}', '${entry.id}')">
                        🗑️ Delete
                    </button>
                </div>
                <div class="entry-content">${escapeHtml(entry.content)}</div>
                ${entry.edited_at ? `<div class="entry-meta">
                    <span>Edited: ${new Date(entry.edited_at).toLocaleString()}</span>
                </div>` : ''}
            </div>
        `;
    }).join('');
    
    container.innerHTML = `
        <h2 style="margin-bottom: 1rem;">
            ${entries.length} ${entries.length === 1 ? 'Entry' : 'Entries'} on ${formatDate(date)}
        </h2>
        ${entriesHTML}
    `;
}

function formatDate(dateStr) {
    const date = new Date(dateStr + 'T00:00:00');
    return date.toLocaleDateString('en-US', { 
        weekday: 'long',
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function deleteEntry(date, entryId) {
    if (!confirm('Are you sure you want to delete this entry? This action cannot be undone.')) {
        return;
    }
    
    fetch(`/journal/${date}?entry_id=${entryId}`, {
        method: 'DELETE'
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            showNotification('Entry deleted successfully', 'success');
            // Remove the entry card from the page
            const entryCard = document.querySelector(`[data-entry-id="${entryId}"]`);
            if (entryCard) {
                entryCard.style.transition = 'all 0.3s ease';
                entryCard.style.opacity = '0';
                entryCard.style.transform = 'translateX(-20px)';
                setTimeout(() => {
                    entryCard.remove();
                    // Reload entries to update count
                    const activeTab = document.querySelector('.view-tab.active').id.replace('tab-', '');
                    if (activeTab === 'day') loadDayEntries();
                    else if (activeTab === 'week') loadWeekEntries();
                    else if (activeTab === 'month') loadMonthEntries();
                }, 300);
            }
        } else {
            showNotification('Failed to delete entry', 'error');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showNotification('Failed to delete entry', 'error');
    });
}

function showNotification(message, type = 'info') {
    // Create a notification element
    const notification = document.createElement('div');
    notification.className = `alert alert-${type}`;
    notification.textContent = message;
    notification.style.position = 'fixed';
    notification.style.top = '20px';
    notification.style.right = '20px';
    notification.style.zIndex = '9999';
    notification.style.padding = '1rem 1.5rem';
    notification.style.borderRadius = '8px';
    notification.style.animation = 'slideIn 0.3s ease';
    
    if (type === 'success') {
        notification.style.background = 'rgba(34, 197, 94, 0.2)';
        notification.style.border = '1px solid rgba(34, 197, 94, 0.4)';
        notification.style.color = '#22c55e';
    } else if (type === 'error') {
        notification.style.background = 'rgba(239, 68, 68, 0.2)';
        notification.style.border = '1px solid rgba(239, 68, 68, 0.4)';
        notification.style.color = '#ef4444';
    }
    
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.style.opacity = '0';
        setTimeout(() => notification.remove(), 300);
    }, 3000);
}
</script>
{% endblock %}
